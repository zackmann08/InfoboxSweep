[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infoboxsweep"
version = "0.1.0"
description = "Wikipedia bot that removes infobox and photograph requests from the talk pages of articles that already have them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywikibot>=11.0",
    "mwparserfromhell>=0.7.2",
]

[project.optional-dependencies]
# PyYAML is only for the test that checks deploy/jobs.example.yaml.
dev = ["pytest", "ruff", "mypy", "coverage>=7.2", "pyyaml"]

[project.scripts]
infoboxsweep = "infoboxsweep.cli:main"
imagesweep = "infoboxsweep.cli:images_main"

[tool.setuptools]
packages = ["infoboxsweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests read the real English Wikipedia, so they only run when
# asked for, with: pytest -m live
addopts = "-m 'not live'"
markers = ["live: reads the real English Wikipedia (never edits); run with -m live"]

[tool.coverage.run]
branch = true
source = ["infoboxsweep"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
omit = ["infoboxsweep/__main__.py"]   # tested by running it, in tests/test_cli.py
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "B",        # bugbear
    "I",        # import order
    "UP",       # modern syntax for the supported Python versions
    "SIM",      # simplifications
    "C90",      # complexity
]

[tool.ruff.lint.per-file-ignores]
# Pywikibot provides `usernames` when it runs a user-config.py.
"deploy/user-config.example.py" = ["F821"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
files = ["infoboxsweep"]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pywikibot", "pywikibot.*"]   # ships no type information
ignore_missing_imports = true
